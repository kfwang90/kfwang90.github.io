# ---------------------------------------------------------------
# 主题 zero：素色极简主题（由原纯静态站点样式迁移而来）
# ---------------------------------------------------------------

# 导航（顺序即显示顺序，url 可以是站内路径或完整外链）
menu:
  - name: 首页
    url: /
  - name: 文章目录
    url: /#posts
  - name: 标签
    url: /#tags
  - name: 关于
    url: /#about
  - name: 联系
    url: https://github.com/kfwang90

# Hero 区（仅首页）
hero:
  tag: "~ /dev/blog $"
  name: Nero
  title: 一名热爱折腾的 IT 工程师

# 关于区（仅首页；lines 中的 {years} 会替换为「当前年份 - years_from」）
about:
  avatar: N
  name: Nero
  role: 全栈工程师
  years_from: 2013
  lines:
    - "{years} 年一线研发经验，关注 AI、研发运维与工程效率。"
    - 白天写业务，晚上写博客，偶尔维护一些开源小项目。

# 统计数字（仅首页）
# value 取 posts = 文章总数；years = 写作年数（按 from 起算、含当年）；其余原样显示
stats:
  - label: 文章
    value: posts
  - label: 年写作
    value: years
    from: 2026
  - label: 好奇心
    value: "∞"

# 页脚社交链接
social:
  - name: GitHub
    url: https://github.com/kfwang90
